  <head>

    <link rel="stylesheet" href="../styles.css?v=20261020-beam-v1" />

  <body class="display-page">
    <main class="app">
      <h1 class="display-title">Solving Splash Boards</h1>
      <p class="display-subtitle"><span>Superimposing all three primary colors clears the tile.</span> <span>Tiles can migrate over their own color and into a neighboring one but cannot cross cleared spaces.</span> <span>Object: clear all the tiles.</span></p>
      <section class="board-wrap" aria-label="Splash solution playback">
        <svg id="board" role="img" aria-label="Animated Splash board"></svg>
      </section>
      <p id="playback-error" role="alert" hidden></p>
    </main>
